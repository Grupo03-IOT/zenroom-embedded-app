; ZenRoom ESP32 forecast firmware
;
;   zenroom      dispositivo real armado segun la Guia de conexiones (WiFi y broker en secrets.ini)
;   zenroom-sim  Wokwi (WiFi Wokwi-GUEST, broker publico de prueba, boton de escenario en GPIO 26)
[platformio]
default_envs = zenroom
extra_configs = secrets*.ini

; Valores por omision; secrets.ini (no versionado) los reemplaza.
[secrets]
build_flags =

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/ArduinoMqttClient@^0.1.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19
build_flags =
    -DCORE_DEBUG_LEVEL=0
    '-DTOPIC_BASE="comfort/site-1"'
    '-DROOM_ID="sala-03"'
    '-DDEVICE_ID="zr-sala-03"'

[env:zenroom]
build_flags =
    ${env.build_flags}
    -DPIN_DHT=23
    -DPIN_BUZZER=26
    -DWIFI_CHANNEL=0
    ${secrets.build_flags}

[env:zenroom-sim]
build_flags =
    ${env.build_flags}
    -DPIN_PRUEBA=26
    -DKEEPALIVE_MS=600000L
