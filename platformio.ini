; ZenRoom ESP32 forecast firmware
[platformio]
default_envs = zenroom

[env:zenroom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/ArduinoMqttClient@^0.1.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19
build_flags =
    -DCORE_DEBUG_LEVEL=0
    '-DTOPIC_BASE="comfort/site-1"'
    '-DROOM_ID="sala-03"'
    '-DDEVICE_ID="zr-sala-03"'

; Solo para simulacion Wokwi E2E. Mantiene el perfil zenroom (hardware real)
; separado, con seis lotes por minuto y namespace MQTT de prueba aislado.
[env:wokwi]
extends = env:zenroom
build_unflags =
    '-DTOPIC_BASE="comfort/site-1"'
build_flags =
    ${env:zenroom.build_flags}
    '-DTOPIC_BASE="comfort/c7iot-e2e-20261105"'
    -DSAMPLE_MS=10000
