; ZenRoom ESP32 forecast firmware
;
;   zenroom      dispositivo real armado segun la Guia de conexiones (WiFi y broker en secrets.ini)
;   zenroom-sim  Wokwi (WiFi Wokwi-GUEST, broker publico de prueba, boton de escenario en GPIO 26)
[platformio]
default_envs = zenroom
extra_configs = secrets*.ini

; Valores por omision; secrets.ini (no versionado) los reemplaza. Ahi tambien se puede fijar
; TOPIC_BASE, ROOM_ID y DEVICE_ID (por omision comfort/site-1, sala-03 y zr-sala-03, en main.cpp).
; zenroom-sim muestrea cada 10 s: cada muestra equivale a un minuto de la sala (tiempo acelerado).
[secrets]
build_flags =

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/ArduinoMqttClient@^0.1.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:zenroom]
build_flags =
    ${env.build_flags}
    -DPIN_DHT=23
    -DPIN_BUZZER=26
    -DWIFI_CHANNEL=0
    ${secrets.build_flags}

[env:zenroom-sim]
build_flags =
    ${env.build_flags}
    -DPIN_PRUEBA=26
    -DKEEPALIVE_MS=600000L
    -DSAMPLE_MS=10000
    ${secrets.build_flags}
